name: Test
on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-control-plane.txt pytest
      - name: Run control-plane tests
        env:
          HERMES_DATA_DIR: ${{ runner.temp }}/hermes-data
        run: pytest tests/ -q
